[package]
name = "splinterpol"
version = "0.1.0"
authors = ["geo-ant"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/geo-ant/splinterpol"
description = "Native 1D and 2D spline interpolation up to degree 12. Fast, accurate, no-std, and no-alloc."
readme = "README.md"
exclude = ["test-assets/**"]
categories = ["mathematics", "science", "multimedia::images", "no-std", "no-std::no-alloc"]
keywords = ["spline", "interpolation", "curve", "image", "no-std"]
rust-version = "1.89"

[features]
# enable fused multiply add instructions. Feature gating this is an idea from
# the interpN crate.
fma = []
# allow dependency on the standard library (i.e. disabling the `no_std`)
std = ["num-traits/std"]
# make this crate and its dependencies #[no_std] (default)
no_std = ["num-traits/libm"]
# only for internal benchmarking purposes
__bench_internal = []
# another internal feature to activate benchmarking against mkl
__compare_mkl = ["mkl-spline/mkl"]
default = ["no_std"]

[dependencies]
# see: docs.rs/crate/num-traits/latest
# this is the way to use the no-std version of the crate
num-traits = {version = "0.2", default-features = false}

[dev-dependencies]
float-cmp = "=0.10"
test-case = "=3.4.0"
criterion = "0.8"
rayon = "1"
rand = "0.10"
paste = "1.0"
interpn = {version = "0.11",  features = ["std", "fma", "deep-unroll"]}
# utility crate for benching mkl against splinterpol
# this crate is empty and doesn't even link mkl without the `__compare_mkl` feature.
# The reason for this weird design is that I can't make a dev-dependency optional.
mkl-spline = {path = "./bench-support/mkl-spline"}

[[bench]]
harness = false
name = "expfilter"
# NOTE: we have to manually enable the feature, otherwise this benchmark won't run
required-features = ["__bench_internal"]

# Example command ON MY MACHINE (TM) FOR BENCHMARKING:
# 
# the taskset -c <processor-list> and the RAYON_NUM_THREADS should by synced
# to each other (meaning the list of processors should have the same length
# as the number of threads).
# 
# # this is for multithreaded code when I was testing interpn with threads
# RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" RAYON_NUM_THREADS=2 taskset -c 1,3 cargo bench
# # this is for single threaded code (also testing against mkl):
# RUSTFLAGS="-C target-cpu=native -C target-feature=+fma"   taskset -c 3 cargo bench --features "fma,interpn/fma,__compare_mkl" 
# # to run only e.g. the 1D interpolation subset of the benchmarks we can run:
# RUSTFLAGS="-C target-cpu=native -C target-feature=+fma"   taskset -c 3 cargo bench --bench interpolation   --features "fma,interpn/fma,__compare_mkl" Interpolation-1D
 
[[bench]]
harness = false
name = "coefficients" # bench the prefiltering step

[[bench]]
harness = false
name = "interpolation"

[[bench]]
harness = false
name = "end2end"
