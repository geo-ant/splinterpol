[package]
name = "splinterpol"
version = "0.1.0"
edition = "2024"

[features]
# enable fused multiply add instructions. Feature gating this is an idea from
# the interpN crate.
fma = []
# allow dependency on the standard library (i.e. disabling the `no_std`)
std = ["num-traits/std"]
# make this crate and its dependencies #[no_std] (default)
no_std = ["num-traits/libm"]
# only for internal benchmarking purposes
__bench_internal = []
default = ["no_std"] 

[dependencies]
# see: docs.rs/crate/num-traits/latest
# this is the way to use the no-std version of the crate
num-traits = {version = "0.2", default-features = false}
interpn = {version = "0.11",  features = ["deep-unroll"], optional = true}

[dev-dependencies]
float-cmp = "=0.10"
test-case = "=3.4.0"
criterion = "0.8"
rayon = "1"
rand = "0.10"
paste = "1.0"
interpn = {version = "0.11",  features = ["deep-unroll"]}

[[bench]]
harness = false
name = "expfilter"
# NOTE: we have to manually enable the feature, otherwise this benchmark won't run
required-features = ["__bench_internal"]

[[bench]]
# Example command ON MY MACHINE (TM):
# the taskset -c <processor-list> and the RAYON_NUM_THREADS should by synced
# to each other (meaning the list of processors should have the same length
# as the number of threads).
# 
# RUSTFLAGS="-C target-cpu=native -C target-feature=+fma" RAYON_NUM_THREADS=2 taskset -c 1,3 cargo bench
harness = false
name = "coefficients" # bench the prefiltering step
